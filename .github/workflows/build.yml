name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK de depuración
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FonOpt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # APK descargable directamente desde la página de Releases (cómodo desde el celular).
      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: FonOpt (última versión de prueba)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
